<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <div class="dashboard-card">
            <h3>Dashboard</h3>
            <p>Welcome Nop bunsong</p>
            <div style="margin-top: auto;">
                <a href="index.html" class="btn">Logout</a>
            </div>
        </div>
        <div class="dashboard-card">
            <h3>EDC Calculator</h3>
            <form id="edcForm" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <input type="number" class="form-control" placeholder="Old Kw" id="oldKw" required>
                </div>
                <div class="form-group">
                    <input type="number" class="form-control" placeholder="new Kw" id="newKw" required>
                </div>
                <p id="paymentResult" style="margin-bottom: 20px;">payment here</p>
                <button type="button" class="btn" onclick="calculateEDC()">Calculator</button>
            </form>
        </div>
        <div class="dashboard-card">
            <h3>Grade Calculator</h3>
            <form id="gradeForm" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <input type="number" class="form-control" placeholder="Score" id="scoreInput" required>
                </div>
                <p id="gradeResult" style="margin-bottom: 20px;">Grade will appear here</p>
                <button type="button" class="btn" onclick="calculateGrade()">Calculate</button>
            </form>
        </div>
    </div>
    <script>
        function calculateEDC() {
            const oldKw = parseFloat(document.getElementById('oldKw').value);
            const newKw = parseFloat(document.getElementById('newKw').value);
            
            if (isNaN(oldKw) || isNaN(newKw) || newKw < oldKw) {
                document.getElementById('paymentResult').innerText = "Please enter valid readings.";
                return;
            }
            const difference = newKw - oldKw;
            const rate = 0.15;
            const payment = difference * rate;
            
            document.getElementById('paymentResult').innerText = `Payment: $${payment.toFixed(2)} (${difference} Kw)`;
        }

        function calculateGrade() {
            const score = parseFloat(document.getElementById('scoreInput').value);
            const resultEl = document.getElementById('gradeResult');

            if (isNaN(score)) {
                resultEl.innerText = "Please enter a valid score.";
                return;
            }

            if (score >= 90 && score <= 100) {
                resultEl.innerText = "Excellent";
            } else if (score >= 70 && score <= 89) {
                resultEl.innerText = "Good";
            } else if (score >= 50 && score <= 69) {
                resultEl.innerText = "Pass";
            } else if (score >= 0 && score < 50) {
                resultEl.innerText = "Fail";
            } else {
                resultEl.innerText = "Invalid score";
            }
        }
    </script>
</body>
</html>
